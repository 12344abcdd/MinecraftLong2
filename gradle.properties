# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# This is required to provide enough memory for the Minecraft decompilation process.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
#org.gradle.jvmargs=-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.jvmargs=-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx4G -XX:+UseParallelGC
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.configureondemand=false
